<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Fundo: Cinza muito escuro, quase preto, com bordas super arredondadas -->
  <rect width="512" height="512" rx="140" fill="#18181B" />
  
  <!-- Símbolo: Branco puro, fonte monoespaçada, bem grande para preencher o espaço -->
  <g fill="#FFFFFF" font-family="'Courier New', Courier, monospace" font-weight="bold">
    <!-- Aumentei o font-size de 250 para 320 e ajustei a posição -->
    <text x="256" y="350" font-size="320" text-anchor="middle" letter-spacing="-15">>_</text>
  </g>
</svg>