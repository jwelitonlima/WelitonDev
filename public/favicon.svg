<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Fundo preto com bordas arredondadas (Apple Style) -->
  <rect width="512" height="512" rx="120" fill="#000000" />
  
  <!-- Traços geométricos perfeitos para preencher o espaço -->
  <g fill="none" stroke="#ffffff" stroke-width="80" stroke-linecap="round" stroke-linejoin="round">
    <!-- O Chevron (>) -->
    <polyline points="150,150 320,256 150,362" />
    <!-- O Underline (_) -->
    <line x1="320" y1="380" x2="450" y2="380" stroke-width="50" />
  </g>
</svg>